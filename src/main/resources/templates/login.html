<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Accesso')}"></head>
<body>
<main class="wrap narrow">
    <header th:replace="~{fragments/layout :: top(false)}"></header>

    <h2 class="sec-title"><span>Accesso amministratore</span></h2>

    <p class="field-error" th:if="${param.error}" role="alert">Nome utente o password non corretti.</p>
    <p class="notice" th:if="${param.logout}" role="status">Sei uscito.</p>

    <form class="panel form" method="post" th:action="@{/login}">
        <label for="username">Nome utente</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Entra</button>
            <a class="btn btn-ghost" th:href="@{/}">Torna alla pagina pubblica</a>
        </div>
    </form>
</main>
</body>
</html>
