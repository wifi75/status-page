<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Servizi controllati')}"></head>
<body>
<main class="wrap">
    <header th:replace="~{fragments/layout :: top(false)}"></header>

    <div class="toolbar">
        <a class="btn btn-primary" th:href="@{/admin/monitors/new}">+ Aggiungi servizio</a>
        <a class="btn btn-secondary" th:href="@{/}">Pagina pubblica</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-ghost">Esci</button>
        </form>
    </div>

    <p class="notice" th:if="${notice}" th:text="${notice}" role="status">Servizio aggiunto</p>

    <h2 class="sec-title"><span>Servizi controllati</span><span th:text="${monitors.size()}">3</span></h2>

    <div class="empty-state" th:if="${monitors.isEmpty()}">
        <p>Nessun servizio ancora.</p>
        <a class="btn btn-primary" th:href="@{/admin/monitors/new}">Aggiungi il primo</a>
    </div>

    <ul class="admin-list" th:unless="${monitors.isEmpty()}">
        <li th:each="m : ${monitors}">
            <a class="admin-row" th:classappend="${!m.enabled} ? 'is-disabled'" th:href="@{/admin/monitors/{id}(id=${m.id})}">
                <span class="dot" th:classappend="${m.lastStatus.cssClass()}" aria-hidden="true"></span>
                <span class="svc-name"><th:block th:text="${m.name}">Servizio</th:block>
                    <small class="target" th:text="${m.type.label() + ' · ' + m.target}">https://esempio.it</small>
                    <small class="target" th:if="${m.lastMessage}" th:text="${m.lastMessage}">HTTP 200</small></span>
                <span class="metric interval" th:text="${m.enabled} ? ${m.intervalSeconds + ' s'} : 'spento'">60 s<span>intervallo</span></span>
                <span class="metric" th:classappend="${m.lastStatus.cssClass()}"
                      th:text="${m.lastResponseMs != null and m.lastStatus.name() != 'DOWN'} ? ${m.lastResponseMs + ' ms'} : ${m.lastStatus.label()}">142 ms</span>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
