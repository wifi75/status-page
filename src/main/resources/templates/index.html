<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${siteTitle})}"></head>
<body>
<main class="wrap">
    <header class="site-header">
        <h1 th:text="${siteTitle}">Stato dei servizi</h1>
    </header>

    <section class="summary" th:classappend="${summary.cssClass()}" aria-live="polite">
        <span class="led" aria-hidden="true"></span>
        <p th:text="${summary.text()}">Tutti i servizi sono operativi</p>
    </section>

    <ul class="monitor-list" th:unless="${monitors.isEmpty()}">
        <li class="monitor" th:each="m : ${monitors}">
            <span class="led" th:classappend="${m.status().cssClass()}" aria-hidden="true"></span>
            <span class="monitor-name" th:text="${m.name()}">Servizio</span>
            <span class="monitor-type" th:text="${m.responseMs() != null} ? ${m.responseMs() + ' ms'} : ''">120 ms</span>
            <span class="monitor-state" th:classappend="${m.status().cssClass()}"
                  th:title="${m.checkedAtText().isEmpty()} ? null : ${'Ultimo controllo ' + m.checkedAtText()}"
                  th:text="${m.status().label()}">operativo</span>
        </li>
    </ul>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
</body>
</html>
