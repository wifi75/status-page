# Stack per Portainer (Stacks → Add stack → Repository).
# Le variabili vanno impostate nello stack Portainer, vedi .env.example.
services:
  app:
    image: ghcr.io/wifi75/status-page:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-status}
      DB_USER: ${DB_USER:-status}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obbligatoria}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      STATUS_SITE_TITLE: ${STATUS_SITE_TITLE:-Stato dei servizi}
      TZ: Europe/Rome
    ports:
      - "${APP_PORT:-8085}:8080"

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-status}
      POSTGRES_USER: ${DB_USER:-status}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obbligatoria}
      TZ: Europe/Rome
    volumes:
      # da PostgreSQL 18 il volume va montato su /var/lib/postgresql
      - status-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  status-db:
