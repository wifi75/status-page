# Stack per Portainer (Stacks → Add stack → Repository).
# Le variabili vanno impostate nello stack Portainer, vedi .env.example.
services:
  app:
    image: ghcr.io/wifi75/status-page:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_PATH: /data/status.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      STATUS_SITE_TITLE: ${STATUS_SITE_TITLE:-Stato dei servizi}
      STATUS_BADGE: ${STATUS_BADGE:-}
      TZ: Europe/Rome
    volumes:
      # database SQLite: è l'unica cosa da salvare nei backup
      - status-data:/data
    ports:
      - "${APP_PORT:-8085}:8080"

volumes:
  status-data:
